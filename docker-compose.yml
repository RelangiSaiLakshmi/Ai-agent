# Milestone 4 — run the API and the monitoring dashboard together.
#   docker compose up --build
#   API   -> http://localhost:8000/docs
#   Dash  -> http://localhost:8501
#
# Both services share one SQLite volume so the dashboard's approval queue and
# the API operate on the same data.
services:
  api:
    build: .
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DB_PATH: /data/app.db
    volumes:
      - app-data:/data

  dashboard:
    build: .
    command: streamlit run frontend/dashboard.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DB_PATH: /data/app.db
    volumes:
      - app-data:/data
    depends_on:
      - api

volumes:
  app-data:
